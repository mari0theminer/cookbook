site_name: 🍳 Niklas' Cookbook
site_description: Rezepte & Küchen-Notizen
site_url: https://cook.mari0.dev

docs_dir: CookBook
site_dir: site

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Hellmodus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: de
  - callouts
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Hauptgerichte:
    - Ramen: hauptgerichte/ramen.md
    - Japanisches Curry Sous-Vide: hauptgerichte/japanisches-curry-sous-vide.md
    - Damwild Jerky: hauptgerichte/damwild-jerky.md
  - Schnelle Gerichte:
    - Kartoffeln Heißluftfritteuse: kurzgerichte/kartoffeln-heissluftfritteuse.md
    - Wrap: kurzgerichte/wrap.md
    - Quick Curry: kurzgerichte/quick-curry.md
    - Gnocchi Express: kurzgerichte/gnocchi-express.md
    - Gyoza: kurzgerichte/gyoza.md
    - Maultaschen: kurzgerichte/maultaschen.md
  - Beilagen:
    - Sous-Vide Honig-Thymian Möhren: beilagen/sous-vide-honig-thymian-moehren.md
  - Tags: tags.md

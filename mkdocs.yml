site_name: 🍳 Niklas' Cookbook
site_description: Rezepte & Küchen-Notizen
site_url: https://DEIN-GITHUB-USERNAME.github.io/cookbook

docs_dir: CookBook
site_dir: site

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Hellmodus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Hauptgerichte:
    - Ramen: Ramen.md
    - Japanisches Curry Sous-Vide: Japanisches-Curry-Sous-Vide.md
    - Damwild Jerky: Damwild-Jerky.md
  - Schnelle Gerichte:
    - Wrap: KurzGerrichte/Wrap.md
    - Kartoffeln Heißluftfritteuse: KurzGerrichte/Kartoffeln-Heissluftfritteuse.md
    - Gyoza: KurzGerrichte/Gyoza.md
    - Quick Curry: KurzGerrichte/Quick curry.md
    - Gnocchi Express: KurzGerrichte/gnoci express.md
    - Maultaschen: KurzGerrichte/maultaschen.md
  - Beilagen:
    - Sous-Vide Honig-Thymian Möhren: Beilagen/Sous-Vide-Honig-Thymian-Moehren.md
